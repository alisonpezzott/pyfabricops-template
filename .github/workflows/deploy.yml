# Deploys fabric-workspace/ when a branch of an environment changes: the
# branch key of each file of environments/ says which branch deploys to it,
# such as main to prod. The pipeline names no environment of its own: a
# first job asks scripts/environments.py which environment the branch
# deploys to, and the deployment runs in the GitHub environment of that
# name, then binds and refreshes the semantic models (see deploy.py). A push
# to a branch of no environment runs the first job only, and deploys
# nothing. The environment connected to Git, dev by default, is written by
# Fabric Git integration, so its run only says so.
#
# Before the first run:
# - A repository made from this template (Use this template on GitHub).
#   In the template repository itself, nothing runs.
# - One GitHub environment (Settings > Environments) per file of
#   environments/, of the same name, such as "dev" and "prod", each with
#   the secrets FAB_TENANT_ID, FAB_CLIENT_ID and FAB_CLIENT_SECRET, of a
#   service principal that is a Contributor of the workspace. Required
#   reviewers on "prod" make a deployment to prod wait for an approval, and
#   deployment branches on each may repeat its branch.
# - A shareable cloud connection to the server and database of each
#   environment, of which the service principal is a user: each semantic
#   model is bound to it.
#
# Nothing records the deployment: each run compares the repository with the
# workspace and sends what differs. To delete the items of the workspace
# that the repository no longer has, add --allow-deletions to the Deploy
# step (see deploy.py for what it never deletes).

name: Deploy workspace

on:
  # Any branch: environments/ says which ones deploy.
  push:
    paths:
      - fabric-workspace/**
      - environments/**
      - scripts/deploy.py
      - scripts/environments.py
  workflow_dispatch:

jobs:
  environment:
    # The template repository itself deploys nothing.
    if: github.repository != 'alisonpezzott/pyfabricops-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install "pyyaml>=6,<7"

      - name: Environment of the branch
        id: branch
        run: |
          name=$(python scripts/environments.py --branch "$GITHUB_REF_NAME")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Branch $GITHUB_REF_NAME deploys to: ${name:-nothing}"

  deploy:
    needs: environment
    if: needs.environment.outputs.name != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.environment.outputs.name }}
    # One deployment at a time per environment: a second run waits for the
    # first, as the script itself takes no lock.
    concurrency:
      group: deploy-${{ needs.environment.outputs.name }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ENVIRONMENT: ${{ needs.environment.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pyfabricops
        run: pip install "pyfabricops>=0.11.0,<0.12.0" "pyyaml>=6,<7"

      - name: Deploy
        run: python scripts/deploy.py --environment "$ENVIRONMENT"
        env:
          FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}
          FAB_CLIENT_ID: ${{ secrets.FAB_CLIENT_ID }}
          FAB_CLIENT_SECRET: ${{ secrets.FAB_CLIENT_SECRET }}
