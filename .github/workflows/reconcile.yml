# Reports drift on weekday mornings: compares main with PRD and develop with
# DEV, the parameters of the semantic models included, and fails when
# anything differs, so that someone looks. It never changes a workspace. A
# report published to DEV from Power BI Desktop shows here as drift.
#
# It uses the "dev" and "prd" environments of deploy.yml. A difference may
# be drift in the workspace or a change of the branch still to deploy; to
# bring the workspace back instead of failing, run the Deploy workspace
# workflow, which sends what differs and deletes nothing unless allowed.

name: Reconcile workspace

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  reconcile:
    # The template repository itself has no workspace to reconcile.
    if: github.repository != 'alisonpezzott/pyfabricops-template'
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            name: DEV
            branch: develop
          - environment: prd
            name: PRD
            branch: main
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch the workspace is deployed from.
          ref: ${{ matrix.branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pyfabricops
        run: pip install "pyfabricops>=0.11.0,<0.12.0"

      - name: Reconcile
        run: >
          python scripts/deploy.py
          --reconcile
          --environment ${{ matrix.name }}
        env:
          FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}
          FAB_CLIENT_ID: ${{ secrets.FAB_CLIENT_ID }}
          FAB_CLIENT_SECRET: ${{ secrets.FAB_CLIENT_SECRET }}
