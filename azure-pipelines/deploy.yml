# Deploys fabric-workspace/ when a branch of an environment changes: the
# branch key of each file of environments/ says which branch deploys to it,
# such as main to prod. A first stage asks scripts/environments.py which
# environment the branch deploys to, and only the stage of that environment
# runs; the others are skipped, and so is every deployment stage on a branch
# of no environment. The deployment then binds and refreshes the semantic
# models (see deploy.py). The environment connected to Git, dev by default,
# is updated from Git instead, as Update in Source control does; the service
# principal needs Git credentials of its own on it (see the README).
#
# Azure DevOps needs the environment of a deployment job when the pipeline
# is compiled, before any file is read, so the environments parameter below
# lists the environments of this repository: the files of environments/,
# by the same names. To add one, add its file and its name there.
#
# Before the first run:
# - A variable group "fabric" (Pipelines > Library) with FAB-TENANT-ID,
#   FAB-CLIENT-ID and FAB-CLIENT-SECRET, this one as a secret, of a service
#   principal that is a Contributor of every workspace.
# - One environment (Pipelines > Environments) per name of the parameter,
#   such as "dev" and "prod", each with an Exclusive Lock check, so that one
#   deployment runs at a time; "prod" with an approval too.
# - This pipeline allowed to use the variable group and the environments
#   (Pipeline permissions of each), or a Permit on its first run.
# - A shareable cloud connection to the server and database of each
#   environment, of which the service principal is a user: each semantic
#   model is bound to it.
# - The pipeline itself: Pipelines > New pipeline > Existing Azure Pipelines
#   YAML file, this one.
#
# Nothing records the deployment: each run compares the repository with the
# workspace and sends what differs, so the build service only reads the
# repository. To delete the items of the workspace that the repository no
# longer has, add --allow-deletions to the Deploy step (see deploy.py for
# what it never deletes).

parameters:
  - name: environments
    displayName: The environments of environments/
    type: object
    default:
      - dev
      - prod

# Any branch: environments/ says which ones deploy.
trigger:
  branches:
    include:
      - "*"
  paths:
    include:
      - fabric-workspace
      - environments
      - scripts/deploy.py
      - scripts/environments.py

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  - group: fabric

stages:
  - stage: Environment
    displayName: Environment of the branch
    jobs:
      - job: Branch
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.13"

          - script: pip install "pyyaml>=6,<7"
            displayName: Install PyYAML

          - script: |
              name=$(python scripts/environments.py --branch "$(Build.SourceBranch)")
              echo "##vso[task.setvariable variable=name;isOutput=true]$name"
              echo "Branch $(Build.SourceBranch) deploys to: ${name:-nothing}"
            name: Resolve
            displayName: Environment of the branch

  - ${{ each environment in parameters.environments }}:
      - stage: Deploy_${{ replace(environment, '-', '_') }}
        displayName: Deploy to ${{ environment }}
        dependsOn: Environment
        condition: >
          and(succeeded(),
          eq(dependencies.Environment.outputs['Branch.Resolve.name'],
          '${{ environment }}'))
        jobs:
          - deployment: Deploy
            displayName: Deploy to ${{ environment }}
            environment: ${{ environment }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    # A deployment job checks out nothing unless asked.
                    - checkout: self

                    - task: UsePythonVersion@0
                      inputs:
                        versionSpec: "3.13"

                    - script: >
                        pip install "pyfabricops>=0.12.0,<0.13.0"
                        "pyyaml>=6,<7"
                      displayName: Install pyfabricops

                    - script: >
                        python scripts/deploy.py
                        --environment ${{ environment }}
                      displayName: Deploy
                      env:
                        # Secret variables reach a script only when mapped.
                        FAB_TENANT_ID: $(FAB-TENANT-ID)
                        FAB_CLIENT_ID: $(FAB-CLIENT-ID)
                        FAB_CLIENT_SECRET: $(FAB-CLIENT-SECRET)
