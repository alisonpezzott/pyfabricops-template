# Reports drift on weekday mornings: compares each scheduled branch with the
# environment it deploys to, the parameters of the semantic models
# included, and fails when anything differs, so that someone looks. It
# never changes a workspace.
#
# The schedule runs once per branch, and each run asks environments/ which
# environment its branch deploys to: the branch key of each file. A
# schedule names its branches when the pipeline is compiled, so the list
# below repeats the branches of the environments; a branch of no
# environment fails. The environment connected to Git, dev by default, is
# left out: changes not committed yet are normal there, and a run of its
# branch updates it from Git (see deploy.py).
#
# Before using it:
# - It uses the "fabric" variable group of deploy.yml, and needs the same
#   Pipeline permission on it.
# - A difference may be drift in the workspace or a change of the branch
#   still to deploy; to bring the workspace back instead of failing, run the
#   deploy pipeline, which sends what differs and deletes nothing unless
#   allowed.

trigger: none

schedules:
  - cron: "0 6 * * 1-5"
    displayName: Weekdays at 06:00 UTC
    branches:
      include:
        - main
    # Run even when the branch did not change: drift happens in the
    # workspace.
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - group: fabric

jobs:
  - job: Reconcile
    displayName: Reconcile $(Build.SourceBranchName)
    steps:
      - checkout: self

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.13"

      - script: pip install "pyfabricops>=0.12.0,<0.13.0" "pyyaml>=6,<7"
        displayName: Install pyfabricops

      - script: >
          python scripts/deploy.py
          --reconcile
          --branch "$(Build.SourceBranch)"
        displayName: Reconcile
        env:
          # Secret variables reach a script only when mapped.
          FAB_TENANT_ID: $(FAB-TENANT-ID)
          FAB_CLIENT_ID: $(FAB-CLIENT-ID)
          FAB_CLIENT_SECRET: $(FAB-CLIENT-SECRET)
